name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Build, Lint, Typecheck & Finance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run build:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & Golden Math tests
        run: npm run test

      - name: Build all apps & packages
        run: npm run build

      - name: Install Playwright Chromium
        run: npx --workspace=@strata/web playwright install --with-deps chromium

      - name: Run public Playwright E2E checks
        run: npx --workspace=@strata/web playwright test e2e/public-and-auth-gates.spec.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
